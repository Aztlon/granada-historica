name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate historical data
        run: npm run validate:data
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke test durable M7 paths
        shell: bash
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          for path in \
            "" \
            "route/bib-rambla/" \
            "place/bib-rambla/" \
            "place/zacatin/" \
            "place/alcaiceria/" \
            "place/madraza/" \
            "place/mezquita-mayor/" \
            "pilot/qr/bib-rambla.svg" \
            "pilot/qr/zacatin.svg" \
            "pilot/qr/alcaiceria.svg" \
            "pilot/qr/madraza.svg" \
            "pilot/qr/mezquita-mayor.svg"
          do
            curl --fail --location --retry 5 --retry-delay 5 "${base}${path}"
          done
          curl --fail --location --retry 5 --retry-delay 5 "${base}place/bib-rambla/?lang=en"
